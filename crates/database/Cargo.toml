[package]
name = "database"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/database.rs"
doctest = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
native-tls = "0.2"
paths.workspace = true
postgres-native-tls = "0.5.3"
serde.workspace = true
serde_json.workspace = true
tiberius = { version = "0.13.0", default-features = false, features = ["tds80", "winauth", "native-tls", "chrono", "sql-browser-tokio"] }
tokio = { workspace = true, features = ["net", "process", "sync", "time", "rt"] }
tokio-postgres = "0.7.18"
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { workspace = true, features = ["v4"] }
zed_credentials_provider.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
