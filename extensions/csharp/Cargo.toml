[package]
name = "zed_csharp"
version = "0.1.0"
# Not inherited from the workspace: Zed rebuilds dev extensions from a symlink outside the
# repository, where the workspace root can't be found.
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/csharp.rs"
crate-type = ["cdylib"]
test = false

[dependencies]
zed_extension_api = "0.7.0"
