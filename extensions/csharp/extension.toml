id = "csharp-dotnet"
name = "C# (.NET)"
description = "C# support with Roslyn, netcoredbg debugging and MSBuild files."
version = "0.1.0"
schema_version = 1
authors = ["Sam Svindland <swsvindland@gmail.com>"]
repository = "https://github.com/zed-industries/zed"

[language_servers.roslyn]
name = "Roslyn"
languages = ["C#"]

[language_servers.roslyn.language_ids]
"C#" = "csharp"

[debug_adapters.netcoredbg]

[grammars.c_sharp]
repository = "https://github.com/tree-sitter/tree-sitter-c-sharp"
commit = "485f0bae0274ac9114797fc10db6f7034e4086e3"

[grammars.xml]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-xml"
commit = "863dbc381f44f6c136a399e684383b977bb2beaa"
path = "xml"
