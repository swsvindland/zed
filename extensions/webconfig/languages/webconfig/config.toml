name = "Web.config"
grammar = "xml"
# Whole file names, so these win over a generic XML language that claims every `.config` file.
path_suffixes = [
    "Web.config",
    "web.config",
    "Web.Debug.config",
    "Web.Release.config",
    "App.config",
    "app.config",
    "App.Debug.config",
    "App.Release.config",
]
block_comment = { start = "<!-- ", prefix = "", end = " -->", tab_size = 0 }
autoclose_before = "<"
brackets = [
    { start = "<", end = ">", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
]
tab_size = 2
